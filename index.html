<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tutanak — Sesli Not</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper: #ECE7DC;
    --paper-deep: #E2DBCB;
    --ink: #22241E;
    --ink-soft: #55584C;
    --line: #C9C0A9;
    --teal: #1F4B43;
    --teal-soft: #35695F;
    --amber: #C1832E;
    --amber-soft: #E0A85A;
    --red: #A8402F;
    --card: #F5F1E7;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(34,36,30,0.035) 28px);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .wrap{ max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    padding: 6px 4px 18px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 22px;
  }
  .brand h1{
    font-family: 'Source Serif 4', serif;
    font-weight: 700; font-style: italic;
    font-size: 32px; margin: 0; letter-spacing: -0.5px;
    color: var(--ink);
  }
  .brand p{
    margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 1.4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .clock{
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft);
    text-align: right;
  }

  /* --- Kayıt paneli --- */
  .deck{
    background: var(--card);
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    padding: 22px;
    position: relative;
    box-shadow: 4px 4px 0 rgba(34,36,30,0.08);
    margin-bottom: 24px;
  }

  .reel-row{
    display:flex; align-items:center; gap: 16px; margin-bottom: 16px;
  }

  .mic-btn{
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid var(--ink);
    background: var(--paper);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    transition: transform .15s ease, background .2s ease;
    position: relative;
  }
  .mic-btn:active{ transform: scale(0.94); }
  .mic-btn.recording{ background: var(--red); border-color: var(--red); }
  .mic-btn svg{ width: 26px; height: 26px; }
  .mic-btn .ico-idle path{ fill: var(--ink); }
  .mic-btn.recording .ico-idle path{ fill: #fff; }

  .mic-btn.recording::after{
    content:''; position:absolute; inset:-6px; border-radius:50%;
    border: 2px solid var(--red); opacity: 0.55;
    animation: pulse-ring 1.6s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{ transform: scale(0.9); opacity: 0.6; }
    100%{ transform: scale(1.35); opacity: 0; }
  }

  .status-block{ flex:1; min-width:0; }
  .status-label{
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;
    letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-soft);
  }
  .status-label.on{ color: var(--red); }
  .tape{
    display:flex; align-items:center; gap: 3px; height: 20px; margin-top: 6px;
    overflow: hidden;
  }
  .tape span{
    width: 3px; background: var(--line); border-radius: 2px;
    height: 6px; transition: background .2s;
  }
  .tape.on span{ background: var(--teal); animation: bar 1.1s ease-in-out infinite; }
  .tape span:nth-child(1){ animation-delay: 0s; }
  .tape span:nth-child(2){ animation-delay: .1s; }
  .tape span:nth-child(3){ animation-delay: .2s; }
  .tape span:nth-child(4){ animation-delay: .3s; }
  .tape span:nth-child(5){ animation-delay: .4s; }
  .tape span:nth-child(6){ animation-delay: .5s; }
  .tape span:nth-child(7){ animation-delay: .6s; }
  .tape span:nth-child(8){ animation-delay: .7s; }
  @keyframes bar{
    0%,100%{ height: 6px; }
    50%{ height: 20px; }
  }

  textarea#transcript{
    width: 100%; min-height: 150px; resize: vertical;
    border: 1px dashed var(--line);
    background: var(--paper);
    border-radius: 2px;
    padding: 14px;
    font-family: 'Times New Roman', Times, serif;
    font-size: 12pt; line-height: 1.15; color: var(--ink);
    text-indent: 3.5cm;
  }
  textarea#transcript:focus{ outline: none; border-color: var(--teal); }
  textarea#transcript::placeholder{ color: #9a947f; }

  .deck-actions{
    display:flex; gap: 10px; margin-top: 14px; flex-wrap: wrap;
  }
  button{
    font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600;
    border-radius: 2px; padding: 10px 16px; cursor: pointer;
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
  }
  button.primary{ background: var(--teal); border-color: var(--teal); color: #fff; }
  button.ghost{ border-color: var(--line); color: var(--ink-soft); }
  button:disabled{ opacity: 0.4; cursor: not-allowed; }

  .warn{
    font-size: 12.5px; color: var(--red); margin-top: 10px;
    font-family: 'IBM Plex Mono', monospace;
    display:none;
  }
  .warn.show{ display:block; }

  /* --- Notlar listesi --- */
  .list-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 12px; gap: 10px;
  }
  .list-head h2{
    font-family: 'Source Serif 4', serif; font-size: 19px; margin:0; font-weight:600;
  }
  input#search{
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
    border: 1px solid var(--line); background: var(--card);
    border-radius: 2px; padding: 8px 10px; width: 160px;
  }
  input#search:focus{ outline:none; border-color: var(--teal); }

  .note{
    background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--teal);
    border-radius: 2px; padding: 14px 16px; margin-bottom: 10px;
    cursor: pointer; transition: border-color .15s;
  }
  .note:hover{ border-left-color: var(--amber); }
  .note-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
  .note-title{ font-weight: 600; font-size: 14.5px; }
  .note-date{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); white-space:nowrap; }
  .note-preview{ font-size: 13px; color: var(--ink-soft); margin-top: 5px; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .note-del{
    border:none; background:none; color: var(--red); font-size: 12px;
    font-family:'IBM Plex Mono', monospace; padding: 4px 0; margin-top:6px; cursor:pointer;
  }
  .empty{
    text-align:center; padding: 30px 10px; color: var(--ink-soft);
    font-family:'IBM Plex Mono', monospace; font-size: 13px; border: 1px dashed var(--line); border-radius:2px;
  }

  /* --- Düzenleme modalı --- */
  .modal-bg{
    position: fixed; inset:0; background: rgba(34,36,30,0.55);
    display:none; align-items:flex-start; justify-content:center; padding: 24px 14px;
    overflow-y: auto; z-index: 50;
  }
  .modal-bg.show{ display:flex; }
  .modal{
    background: var(--card); border: 1.5px solid var(--ink); border-radius: 3px;
    max-width: 640px; width:100%; padding: 20px; margin-top: 10px;
    box-shadow: 6px 6px 0 rgba(34,36,30,0.15);
  }
  .modal input#editTitle{
    width:100%; font-family:'Source Serif 4', serif; font-weight:600; font-size:18px;
    border:none; border-bottom: 1.5px solid var(--ink); background:transparent;
    padding: 4px 2px 8px; margin-bottom: 12px;
  }
  .modal input#editTitle:focus{ outline:none; border-color: var(--teal); }
  .modal textarea#editBody{
    width:100%; min-height: 220px; font-family: 'Times New Roman', Times, serif; font-size: 12pt;
    line-height: 1.15; text-indent: 3.5cm;
    border:1px dashed var(--line); border-radius:2px; padding:12px; background: var(--paper);
  }
  .modal textarea#editBody:focus{ outline:none; border-color: var(--teal); }
  .modal-actions{ display:flex; justify-content:space-between; margin-top:14px; gap:10px; }

  footer{
    text-align:center; margin-top: 30px; font-size: 11.5px; color: var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }

  /* --- Giriş ekranı --- */
  .auth-bg{
    min-height: 100vh; display:flex; align-items:center; justify-content:center;
    padding: 24px 16px;
  }
  .auth-card{
    background: var(--card); border: 1.5px solid var(--ink); border-radius: 3px;
    padding: 28px 24px; max-width: 360px; width:100%;
    box-shadow: 4px 4px 0 rgba(34,36,30,0.1);
  }
  .auth-card h1{
    font-family: 'Source Serif 4', serif; font-weight:700; font-style:italic;
    font-size: 28px; margin: 0 0 4px;
  }
  .auth-sub{
    font-size: 12.5px; color: var(--ink-soft); margin: 0 0 18px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .auth-card input{
    width:100%; padding: 10px 12px; margin-bottom: 10px;
    border: 1px solid var(--line); border-radius: 2px; background: var(--paper);
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink);
  }
  .auth-card input:focus{ outline:none; border-color: var(--teal); }
  .auth-error{
    font-size: 12px; color: var(--red); min-height: 16px; margin-bottom: 6px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .auth-actions{ display:flex; gap: 8px; margin-top: 6px; }
  .auth-actions button{ flex:1; }
  .auth-divider{
    text-align:center; font-size: 11px; color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace; margin: 12px 0 8px; position: relative;
  }

  .user-bar{
    display:flex; align-items:center; justify-content:space-between;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft);
    padding: 8px 4px; margin-bottom: 6px;
  }
  .user-bar button{ padding: 5px 10px; font-size: 12px; }
</style>
</head>
<body>

<div class="auth-bg" id="authScreen" style="display:none;">
  <div class="auth-card">
    <h1>Tutanak</h1>
    <p class="auth-sub">Notlarınıza her cihazdan erişmek için giriş yapın</p>
    <input type="email" id="authEmail" placeholder="e-posta">
    <input type="password" id="authPassword" placeholder="şifre (en az 6 karakter)">
    <div class="auth-error" id="authError"></div>
    <div class="auth-actions">
      <button class="primary" id="authSignInBtn">Giriş Yap</button>
      <button class="ghost" id="authSignUpBtn">Hesap Oluştur</button>
    </div>
    <div class="auth-divider">veya</div>
    <button class="ghost" id="authGoogleBtn" style="width:100%;">Google ile Giriş Yap</button>
  </div>
</div>

<div class="wrap" id="mainApp">
  <div class="user-bar" id="userBar" style="display:none;">
    <span id="userEmailEl"></span>
    <button class="ghost" id="logoutBtn">Çıkış Yap</button>
  </div>
  <header>
    <div class="brand">
      <h1>Tutanak</h1>
      <p>Sesli Not · Türkçe</p>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="deck">
    <div class="reel-row">
      <button class="mic-btn" id="micBtn" title="Kayda başla / durdur">
        <svg class="ico-idle" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <div class="status-block">
        <div class="status-label" id="statusLabel">Hazır</div>
        <div class="tape" id="tape">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <textarea id="transcript" placeholder="Mikrofona basıp konuşmaya başlayın; söyledikleriniz burada belirecek. Metni istediğiniz zaman elle düzenleyebilirsiniz."></textarea>

    <div class="warn" id="warnBox"></div>

    <div class="deck-actions">
      <button class="primary" id="saveBtn">Notu Kaydet</button>
      <button class="ghost" id="wordBtn">Word'e Aktar (.doc)</button>
      <button class="ghost" id="clearBtn">Temizle</button>
    </div>
  </div>

  <div class="list-head">
    <h2>Kayıtlı Notlar</h2>
    <input type="text" id="search" placeholder="ara...">
  </div>
  <div id="notesList"></div>

  <footer id="footerNote">Ses tanıma bu cihazda ve tarayıcıda çalışır.</footer>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <input type="text" id="editTitle">
    <textarea id="editBody"></textarea>
    <div class="modal-actions">
      <button class="ghost" id="deleteInModal">Sil</button>
      <div style="display:flex; gap:8px;">
        <button class="ghost" id="wordBtnModal">Word'e Aktar</button>
        <button class="ghost" id="closeModal">Vazgeç</button>
        <button class="primary" id="saveModal">Kaydet</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const micBtn = document.getElementById('micBtn');
  const statusLabel = document.getElementById('statusLabel');
  const tape = document.getElementById('tape');
  const transcriptEl = document.getElementById('transcript');
  const warnBox = document.getElementById('warnBox');
  const saveBtn = document.getElementById('saveBtn');
  const clearBtn = document.getElementById('clearBtn');
  const notesList = document.getElementById('notesList');
  const searchEl = document.getElementById('search');
  const clockEl = document.getElementById('clock');

  const modalBg = document.getElementById('modalBg');
  const editTitle = document.getElementById('editTitle');
  const editBody = document.getElementById('editBody');
  const deleteInModal = document.getElementById('deleteInModal');
  const closeModal = document.getElementById('closeModal');
  const saveModal = document.getElementById('saveModal');

  const authScreen = document.getElementById('authScreen');
  const mainApp = document.getElementById('mainApp');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authError = document.getElementById('authError');
  const authSignInBtn = document.getElementById('authSignInBtn');
  const authSignUpBtn = document.getElementById('authSignUpBtn');
  const userBar = document.getElementById('userBar');
  const userEmailEl = document.getElementById('userEmailEl');
  const logoutBtn = document.getElementById('logoutBtn');
  const footerNote = document.getElementById('footerNote');

  let firebaseConfigured = false;
  let currentUid = null;

  let notes = [];
  let editingId = null;
  let recognizing = false;
  let recognition = null;
  let finalText = '';
  let rawFinalWords = [];
  let noSpaceBeforeNext = false;
  let heldWord = null; // 2 kelimelik bir komutun başlangıcı olabilecek, bir sonraki parçayla birleşmesi için bekletilen kelime
  let userStoppedManually = false;

  // Sesli noktalama komutları — Türkçe kelime(ler) söylenince ilgili işarete dönüşür
  const PUNCT_COMMANDS = [
    { words: ['soru', 'işareti'], symbol: '?' },
    { words: ['ünlem', 'işareti'], symbol: '!' },
    { words: ['iki', 'nokta'], symbol: ':' },
    { words: ['noktalı', 'virgül'], symbol: ';' },
    { words: ['üç', 'nokta'], symbol: '…' },
    { words: ['yeni', 'paragraf'], symbol: '\n\n', isBreak: true },
    { words: ['yeni', 'satır'], symbol: '\n', isBreak: true },
    { words: ['parantez', 'aç'], symbol: '(', openBracket: true },
    { words: ['parantez', 'kapa'], symbol: ')' },
    { words: ['parantez', 'kapat'], symbol: ')' },
    { words: ['tırnak', 'aç'], symbol: '"', openBracket: true },
    { words: ['tırnak', 'kapa'], symbol: '"' },
    { words: ['tırnak', 'kapat'], symbol: '"' },
    { words: ['nokta'], symbol: '.' },
    { words: ['virgül'], symbol: ',' },
    { words: ['virgul'], symbol: ',' },
    { words: ['ünlem'], symbol: '!' },
    { words: ['tire'], symbol: '-', spaceBoth: true },
  ];

  function tokenizeWithPunctCommands(words){
    const tokens = [];
    let i = 0;
    while(i < words.length){
      let matched = null;
      if(i + 1 < words.length){
        const w2a = words[i].toLowerCase();
        const w2b = words[i+1].toLowerCase();
        matched = PUNCT_COMMANDS.find(c => c.words.length === 2 && c.words[0] === w2a && c.words[1] === w2b);
        if(matched){ tokens.push({ type:'symbol', ...matched }); i += 2; continue; }
      }
      const w1 = words[i].toLowerCase();
      matched = PUNCT_COMMANDS.find(c => c.words.length === 1 && c.words[0] === w1);
      if(matched){ tokens.push({ type:'symbol', ...matched }); i += 1; continue; }
      tokens.push({ type:'word', text: words[i] });
      i += 1;
    }
    return tokens;
  }

  function appendTokensToFinalText(tokens){
    tokens.forEach(tok => {
      if(tok.type === 'word'){
        if(finalText.length > 0 && !noSpaceBeforeNext) finalText += ' ';
        finalText += tok.text;
        noSpaceBeforeNext = false;
      } else if(tok.isBreak){
        finalText = finalText.replace(/[ \t]+$/, '');
        finalText += tok.symbol;
        noSpaceBeforeNext = true;
      } else if(tok.spaceBoth){
        finalText = finalText.replace(/\s+$/, '');
        finalText += (finalText.length ? ' ' : '') + tok.symbol + ' ';
        noSpaceBeforeNext = true;
      } else if(tok.openBracket){
        if(finalText.length > 0 && !noSpaceBeforeNext) finalText += ' ';
        finalText += tok.symbol;
        noSpaceBeforeNext = true;
      } else {
        finalText = finalText.replace(/\s+$/, '');
        finalText += tok.symbol;
        noSpaceBeforeNext = false;
      }
    });
  }

  const STORAGE_KEY = 'tutanak-notes';

  function updateClock(){
    const d = new Date();
    clockEl.textContent = d.toLocaleDateString('tr-TR', { day:'2-digit', month:'long', year:'numeric' }) + ' · ' +
                           d.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ---------- Depolama ----------
  // Not: Bu uygulama artık bağımsız bir web sitesi olarak (GitHub Pages) çalıştığı
  // için notlar bu tarayıcının kendi kalıcı depolamasında (localStorage) tutulur.
  // Bu, yalnızca kullandığınız cihaz + tarayıcıya özeldir; tarayıcı verilerini
  // temizlerseniz veya başka bir cihaz/tarayıcıdan girerseniz notlar görünmez.
  async function loadNotes(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      notes = raw ? JSON.parse(raw) : [];
    }catch(e){
      notes = [];
    }
    renderList();
  }

  async function persistNotes(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }catch(e){
      console.error('Notlar kaydedilemedi', e);
    }
  }

  function isPossibleCommandStart(word){
    const w = word.toLowerCase();
    return PUNCT_COMMANDS.some(c => c.words.length === 2 && c.words[0] === w);
  }

  function flushHeldWord(){
    if(heldWord !== null){
      appendTokensToFinalText(tokenizeWithPunctCommands([heldWord]));
      heldWord = null;
    }
  }

  // ---------- Ses tanıma ----------
  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognitionImpl){
    warnBox.textContent = 'Bu tarayıcı canlı ses tanımayı desteklemiyor. Lütfen güncel Chrome tarayıcısı ile açın.';
    warnBox.classList.add('show');
    micBtn.disabled = true;
  } else {
    recognition = new SpeechRecognitionImpl();
    recognition.lang = 'tr-TR';
    recognition.continuous = true;
    recognition.interimResults = true;

    function appendFinalChunk(chunk){
      const newWords = chunk.trim().split(/\s+/).filter(Boolean);
      if(newWords.length === 0) return;
      const maxOverlap = Math.min(8, rawFinalWords.length, newWords.length);
      let overlap = 0;
      for(let len = maxOverlap; len > 0; len--){
        const tail = rawFinalWords.slice(rawFinalWords.length - len).join(' ').toLowerCase();
        const head = newWords.slice(0, len).join(' ').toLowerCase();
        if(tail === head){ overlap = len; break; }
      }
      const trulyNew = newWords.slice(overlap);
      if(trulyNew.length === 0) return;
      rawFinalWords = rawFinalWords.concat(trulyNew);

      let combined = trulyNew.slice();
      if(heldWord !== null){
        combined = [heldWord].concat(combined);
        heldWord = null;
      }

      let toProcess = combined;
      if(combined.length > 0 && isPossibleCommandStart(combined[combined.length - 1])){
        heldWord = combined[combined.length - 1];
        toProcess = combined.slice(0, -1);
      }

      if(toProcess.length){
        appendTokensToFinalText(tokenizeWithPunctCommands(toProcess));
      }
    }

    recognition.onresult = function(event){
      let interim = '';
      for(let i = event.resultIndex; i < event.results.length; i++){
        const chunk = event.results[i][0].transcript;
        if(event.results[i].isFinal){
          appendFinalChunk(chunk);
        } else {
          interim += chunk;
        }
      }
      transcriptEl.value = (finalText + interim).trim();
    };

    recognition.onerror = function(event){
      if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        warnBox.textContent = 'Mikrofon izni verilmedi. Tarayıcı ayarlarından mikrofon erişimine izin verin.';
        warnBox.classList.add('show');
        stopRecording(true);
      } else if(event.error === 'no-speech'){
        // sessizlik — otomatik olarak devam edecek
      } else {
        warnBox.textContent = 'Ses tanımada bir sorun oluştu (' + event.error + '). Tekrar deneyin.';
        warnBox.classList.add('show');
      }
    };

    recognition.onend = function(){
      if(recognizing && !userStoppedManually){
        // Chrome uzun sessizlikte otomatik durdurabiliyor; devam ettir
        try{ recognition.start(); }catch(e){}
      }
    };
  }

  function startRecording(){
    if(!recognition) return;
    userStoppedManually = false;
    warnBox.classList.remove('show');
    try{
      recognition.start();
      recognizing = true;
      micBtn.classList.add('recording');
      statusLabel.textContent = 'Kaydediliyor…';
      statusLabel.classList.add('on');
      tape.classList.add('on');
    }catch(e){
      warnBox.textContent = 'Kayıt başlatılamadı. Sayfayı yenileyip tekrar deneyin.';
      warnBox.classList.add('show');
    }
  }

  function stopRecording(silent){
    userStoppedManually = true;
    recognizing = false;
    if(recognition){ try{ recognition.stop(); }catch(e){} }
    flushHeldWord();
    transcriptEl.value = finalText.trim();
    micBtn.classList.remove('recording');
    statusLabel.textContent = 'Hazır';
    statusLabel.classList.remove('on');
    tape.classList.remove('on');
  }

  micBtn.addEventListener('click', function(){
    if(recognizing){ stopRecording(); } else { startRecording(); }
  });

  transcriptEl.addEventListener('input', function(){
    // elle düzenlemede finalText'i ve dinleme durumunu senkron tut
    finalText = transcriptEl.value;
    rawFinalWords = finalText.trim().length ? finalText.trim().split(/\s+/) : [];
    noSpaceBeforeNext = false;
    heldWord = null;
  });

  clearBtn.addEventListener('click', function(){
    stopRecording();
    transcriptEl.value = '';
    finalText = '';
    rawFinalWords = [];
    noSpaceBeforeNext = false;
    heldWord = null;
  });

  // ---------- Firebase / çoklu cihaz senkronizasyonu ----------
  let firebaseStatusReceived = false;

  window.addEventListener('tutanak-firebase-status', function(e){
    firebaseStatusReceived = true;
    firebaseConfigured = e.detail.configured;
    if(firebaseConfigured){
      mainApp.style.display = 'none';
      authScreen.style.display = 'flex';
      footerNote.textContent = 'Notlarınız hesabınıza bağlı olarak tüm cihazlarda senkronize edilir.';
    } else {
      footerNote.textContent = 'Ses tanıma bu cihazda ve tarayıcıda çalışır; notlar yalnızca bu tarayıcıda saklanır.';
      loadNotes();
    }
  });

  // Firebase modülü ağ engeli veya bağlantı sorunu yüzünden hiç yüklenmezse,
  // uygulamanın eski (yerel depolama) moduyla çalışmaya devam etmesini sağla.
  setTimeout(function(){
    if(!firebaseStatusReceived) loadNotes();
  }, 1500);

  window.addEventListener('tutanak-auth', function(e){
    if(e.detail.loggedIn){
      currentUid = e.detail.uid;
      authScreen.style.display = 'none';
      mainApp.style.display = 'block';
      userBar.style.display = 'flex';
      userEmailEl.textContent = e.detail.email;
    } else {
      currentUid = null;
      notes = [];
      renderList();
      mainApp.style.display = 'none';
      authScreen.style.display = 'flex';
      authError.textContent = '';
    }
  });

  window.addEventListener('tutanak-notes', function(e){
    notes = e.detail;
    renderList();
  });

  const authGoogleBtn = document.getElementById('authGoogleBtn');

  function showAuthError(err){
    const map = {
      'auth/invalid-email': 'Geçersiz e-posta adresi.',
      'auth/missing-password': 'Şifre girin.',
      'auth/weak-password': 'Şifre en az 6 karakter olmalı.',
      'auth/email-already-in-use': 'Bu e-posta zaten kayıtlı, Giriş Yap\'ı deneyin.',
      'auth/invalid-credential': 'E-posta veya şifre hatalı.',
      'auth/wrong-password': 'E-posta veya şifre hatalı.',
      'auth/user-not-found': 'Bu e-posta ile kayıtlı hesap bulunamadı, Hesap Oluştur\'u deneyin.',
      'auth/popup-blocked': 'Tarayıcı açılır pencereyi engelledi. Tarayıcı ayarlarından açılır pencerelere izin verin.',
      'auth/popup-closed-by-user': 'Google giriş penceresi kapatıldı, tekrar deneyin.',
      'auth/unauthorized-domain': 'Bu site adresi Firebase\'de yetkili alan adları listesine eklenmemiş (Authentication → Settings → Authorized domains).'
    };
    authError.textContent = map[err.code] || ('Bir hata oluştu: ' + err.message);
  }

  authSignInBtn.addEventListener('click', function(){
    authError.textContent = '';
    window.TutanakCloud.signIn(authEmail.value.trim(), authPassword.value)
      .catch(showAuthError);
  });

  authSignUpBtn.addEventListener('click', function(){
    authError.textContent = '';
    window.TutanakCloud.signUp(authEmail.value.trim(), authPassword.value)
      .catch(showAuthError);
  });

  authGoogleBtn.addEventListener('click', function(){
    authError.textContent = '';
    window.TutanakCloud.signInGoogle().catch(showAuthError);
  });

  logoutBtn.addEventListener('click', function(){
    window.TutanakCloud.signOutUser();
  });

  // ---------- Not kaydetme ----------
  saveBtn.addEventListener('click', async function(){
    flushHeldWord();
    transcriptEl.value = finalText.trim();
    const text = transcriptEl.value.trim();
    if(!text) return;
    const title = text.split(/\s+/).slice(0, 6).join(' ') + (text.split(/\s+/).length > 6 ? '…' : '');
    const note = {
      id: 'n' + Date.now(),
      title: title,
      body: text,
      created: new Date().toISOString()
    };
    if(firebaseConfigured && currentUid){
      await window.TutanakCloud.saveNote(currentUid, note);
      // liste, Firestore'un canlı senkronizasyonuyla (onSnapshot) otomatik güncellenir
    } else {
      notes.unshift(note);
      await persistNotes();
      renderList();
    }
    stopRecording();
    transcriptEl.value = '';
    finalText = '';
    rawFinalWords = [];
    noSpaceBeforeNext = false;
  });

  // ---------- Word'e aktarma ----------
  function exportToWord(title, body){
    const safeTitle = (title || 'not').replace(/[\\/:*?"<>|]+/g, ' ').trim() || 'not';
    const paragraphs = body.split(/\n{2,}/).map(par =>
      '<p>' + par.split('\n').map(line => escapeHtml(line)).join('<br>') + '</p>'
    ).join('\n');

    const html =
      '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
      'xmlns:w="urn:schemas-microsoft-com:office:word" ' +
      'xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8">' +
      '<style>' +
      '@page{ size: 21cm 29.7cm; margin: 2.5cm; }' +
      'body{ font-family:"Times New Roman", Times, serif; font-size:12pt; line-height:1.15; }' +
      'p{ text-indent:3.5cm; margin:0 0 8pt 0; }' +
      '</style></head><body>' + paragraphs + '</body></html>';

    const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = safeTitle + '.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---------- Liste ----------
  function formatDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('tr-TR', { day:'2-digit', month:'2-digit', year:'2-digit' }) + ' ' +
           d.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
  }

  function renderList(){
    const q = searchEl.value.trim().toLowerCase();
    const filtered = notes.filter(n =>
      !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q)
    );

    if(filtered.length === 0){
      notesList.innerHTML = '<div class="empty">' + (notes.length === 0 ? 'Henüz kayıtlı not yok. Mikrofona basıp ilk notunuzu oluşturun.' : 'Aramanızla eşleşen not bulunamadı.') + '</div>';
      return;
    }

    notesList.innerHTML = '';
    filtered.forEach(n => {
      const div = document.createElement('div');
      div.className = 'note';
      div.innerHTML =
        '<div class="note-top"><div class="note-title"></div><div class="note-date">' + formatDate(n.created) + '</div></div>' +
        '<div class="note-preview"></div>';
      div.querySelector('.note-title').textContent = n.title;
      div.querySelector('.note-preview').textContent = n.body;
      div.addEventListener('click', () => openModal(n.id));
      notesList.appendChild(div);
    });
  }

  searchEl.addEventListener('input', renderList);

  // ---------- Modal (düzenleme) ----------
  function openModal(id){
    const n = notes.find(x => x.id === id);
    if(!n) return;
    editingId = id;
    editTitle.value = n.title;
    editBody.value = n.body;
    modalBg.classList.add('show');
  }

  closeModal.addEventListener('click', () => modalBg.classList.remove('show'));
  modalBg.addEventListener('click', (e) => { if(e.target === modalBg) modalBg.classList.remove('show'); });

  saveModal.addEventListener('click', async function(){
    const n = notes.find(x => x.id === editingId);
    if(!n) return;
    const updated = { ...n, title: editTitle.value.trim() || n.title, body: editBody.value.trim() };
    if(firebaseConfigured && currentUid){
      await window.TutanakCloud.saveNote(currentUid, updated);
    } else {
      n.title = updated.title;
      n.body = updated.body;
      await persistNotes();
      renderList();
    }
    modalBg.classList.remove('show');
  });

  deleteInModal.addEventListener('click', async function(){
    if(firebaseConfigured && currentUid){
      await window.TutanakCloud.deleteNote(currentUid, editingId);
    } else {
      notes = notes.filter(x => x.id !== editingId);
      await persistNotes();
      renderList();
    }
    modalBg.classList.remove('show');
  });

  const wordBtn = document.getElementById('wordBtn');
  const wordBtnModal = document.getElementById('wordBtnModal');

  wordBtn.addEventListener('click', function(){
    flushHeldWord();
    transcriptEl.value = finalText.trim();
    const text = transcriptEl.value.trim();
    if(!text) return;
    const title = text.split(/\s+/).slice(0, 6).join(' ');
    exportToWord(title, text);
  });

  wordBtnModal.addEventListener('click', function(){
    const n = notes.find(x => x.id === editingId);
    if(!n) return;
    exportToWord(editTitle.value.trim() || n.title, editBody.value);
  });

})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
    signInWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ================================================================
  // Firebase konsolundan (console.firebase.google.com) aldığınız
  // proje ayarlarını aşağıya yapıştırın. Doldurmadığınız sürece
  // uygulama otomatik olarak eski (yalnızca bu tarayıcıda saklama)
  // moduyla çalışmaya devam eder.
  // ================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyBqegLMxdyEn2aH6IzCmHK2eqQlrCaJi4A",
    authDomain: "evraklar.firebaseapp.com",
    projectId: "evraklar",
    storageBucket: "evraklar.firebasestorage.app",
    messagingSenderId: "930542368763",
    appId: "1:930542368763:web:c44410d800a51dfbd67d5e"
  };

  const isConfigured = !String(firebaseConfig.apiKey).includes('BURAYA');

  window.dispatchEvent(new CustomEvent('tutanak-firebase-status', { detail: { configured: isConfigured } }));

  if(isConfigured){
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let unsubscribeNotes = null;

    window.TutanakCloud = {
      signUp(email, password){ return createUserWithEmailAndPassword(auth, email, password); },
      signIn(email, password){ return signInWithEmailAndPassword(auth, email, password); },
      signInGoogle(){ return signInWithPopup(auth, new GoogleAuthProvider()); },
      signOutUser(){ return signOut(auth); },
      saveNote(uid, note){ return setDoc(doc(db, 'users', uid, 'notes', note.id), note); },
      deleteNote(uid, noteId){ return deleteDoc(doc(db, 'users', uid, 'notes', noteId)); }
    };

    onAuthStateChanged(auth, function(user){
      if(unsubscribeNotes){ unsubscribeNotes(); unsubscribeNotes = null; }
      if(user){
        window.dispatchEvent(new CustomEvent('tutanak-auth', { detail: { loggedIn:true, email:user.email, uid:user.uid } }));
        const notesQuery = query(collection(db, 'users', user.uid, 'notes'), orderBy('created', 'desc'));
        unsubscribeNotes = onSnapshot(notesQuery, function(snapshot){
          const list = [];
          snapshot.forEach(d => list.push(d.data()));
          window.dispatchEvent(new CustomEvent('tutanak-notes', { detail: list }));
        });
      } else {
        window.dispatchEvent(new CustomEvent('tutanak-auth', { detail: { loggedIn:false } }));
      }
    });
  }
</script>

</body>
